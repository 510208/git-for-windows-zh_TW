name: 測試 PowerShell 安裝腳本

on:
  push:
    branches: [main, develop]
    paths:
      - "apply_git_language_pack.ps1"
      - "install.ps1"
      - "check_syntax_detailed.ps1"
      - ".github/workflows/test-script.yml"
  pull_request:
    branches: [main]
    paths:
      - "apply_git_language_pack.ps1"
      - "install.ps1"
      - "check_syntax_detailed.ps1"
      - ".github/workflows/test-script.yml"
  workflow_dispatch: # 允許手動觸發

jobs:
  test-powershell-script:
    name: 測試 PowerShell 腳本 (PowerShell ${{ matrix.powershell-version }})
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        powershell-version: ["5.1", "7.2"]

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v6

      - name: 驗證 Git 環境
        run: |
          # 設置編碼
          [console]::InputEncoding = [console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          $PSDefaultParameterValues['*:Encoding'] = 'utf8'

          Write-Host "檢查系統 Git 環境..."

          # 驗證 Git 是否可用
          try {
            $gitCommand = Get-Command git -ErrorAction Stop
            Write-Host "找到 Git: $($gitCommand.Source)"

            $gitVersion = git --version
            Write-Host "Git 版本: $gitVersion"

            # 獲取 Git 安裝目錄
            $gitPath = $gitCommand.Source
            $gitDir = Split-Path $gitPath -Parent
            $gitInstallDir = Split-Path $gitDir -Parent
            Write-Host "Git 安裝目錄: $gitInstallDir"

          } catch {
            Write-Host "Git 環境檢查失敗: $($_.Exception.Message)"
            exit 1
          }

        shell: powershell

      - name: 設置 PowerShell 版本
        run: |
          # 設置編碼
          [console]::InputEncoding = [console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          $PSDefaultParameterValues['*:Encoding'] = 'utf8'

          if ('${{ matrix.powershell-version }}' -eq '5.1') {
            Write-Host "使用 Windows PowerShell 5.1"
            "POWERSHELL_EXE=powershell.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "使用 PowerShell 7.2"
            "POWERSHELL_EXE=pwsh.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        shell: powershell

      - name: 驗證環境
        run: |
          # 根據 PowerShell 版本設置可執行文件
          if ('${{ matrix.powershell-version }}' -eq '5.1') {
            $powershellExe = "powershell.exe"
          } else {
            $powershellExe = "pwsh.exe"
          }

          Write-Host "PowerShell Version:"
          & $powershellExe -Command '$PSVersionTable.PSVersion'

          Write-Host "Git Version:"
          & $powershellExe -Command "git --version"

          Write-Host "Git Installation Path:"
          & $powershellExe -Command "(Get-Command git).Source"
        shell: powershell

      - name: 語法檢查
        run: |
          # 根據 PowerShell 版本設置可執行文件
          if ('${{ matrix.powershell-version }}' -eq '5.1') {
            $powershellExe = "powershell.exe"
          } else {
            $powershellExe = "pwsh.exe"
          }

          Write-Host "Checking PowerShell script syntax..."
          & $powershellExe -ExecutionPolicy Bypass -File check_syntax_detailed.ps1
        shell: powershell

      - name: 腳本邏輯驗證
        run: |
          # 根據 PowerShell 版本設置可執行文件
          if ('${{ matrix.powershell-version }}' -eq '5.1') {
            $powershellExe = "powershell.exe"
          } else {
            $powershellExe = "pwsh.exe"
          }

          Write-Host "Validating script core logic..."

          # 檢查腳本能否正常啟動和進行基本檢查
          & $powershellExe -Command "
            try {
              # Test Git detection
              `$gitCommand = Get-Command git -ErrorAction Stop
              Write-Host 'Git detection OK: ' `$gitCommand.Source

              # Test version retrieval
              `$gitVersionOutput = git --version
              if (`$gitVersionOutput -match 'git version (\d+\.\d+\.\d+)') {
                Write-Host 'Git version retrieval OK: ' `$Matches[1]
              } else {
                Write-Host 'Git version parsing failed'
                exit 1
              }

              # Test script core variables and function definitions
              `$content = Get-Content './apply_git_language_pack.ps1' -Raw
              `$requiredItems = @('GitHubUser', 'GitHubRepo', 'PSVersionTable', 'Invoke-WebRequest', 'Expand-Archive')

              foreach (`$item in `$requiredItems) {
                if (`$content -match [regex]::Escape(`$item)) {
                  Write-Host \`"Found required component in apply_git_language_pack.ps1: `$item\`"
                } else {
                  Write-Host \`"Missing required component in apply_git_language_pack.ps1: `$item\`"
                  exit 1
                }
              }

              # Test install.ps1 core variables and function definitions
              `$installContent = Get-Content './install.ps1' -Raw
              `$installRequiredItems = @('GitHubUser', 'GitHubRepo', 'PSVersionTable', 'Invoke-WebRequest', 'Expand-Archive', 'IsInRole', 'Administrator')

              foreach (`$item in `$installRequiredItems) {
                if (`$installContent -match [regex]::Escape(`$item)) {
                  Write-Host \`"Found required component in install.ps1: `$item\`"
                } else {
                  Write-Host \`"Missing required component in install.ps1: `$item\`"
                  exit 1
                }
              }

              Write-Host 'Script logic validation passed'
            } catch {
              Write-Host \`"Validation failed: `$_\`"
              exit 1
            }
          "
        shell: powershell

      - name: 測試腳本相容性
        run: |
          # 根據 PowerShell 版本設置可執行文件
          if ('${{ matrix.powershell-version }}' -eq '5.1') {
            $powershellExe = "powershell.exe"
          } else {
            $powershellExe = "pwsh.exe"
          }

          Write-Host "Testing script compatibility with PowerShell ${{ matrix.powershell-version }}..."

          # 測試幫助資訊
          & $powershellExe -Command "Get-Help ./apply_git_language_pack.ps1 -ErrorAction SilentlyContinue" | Out-Null

          # 重設退出代碼（Get-Help 可能返回非零退出代碼）
          $LASTEXITCODE = 0

          # 測試腳本能否正常啟動
          Write-Host "PowerShell ${{ matrix.powershell-version }} compatibility test passed"
        shell: powershell

      - name: 清理測試環境
        if: always()
        run: |
          # 清理臨時文件
          Get-ChildItem "$env:TEMP\git-lang-pack*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Get-ChildItem "$env:TEMP\build-*.zip" -ErrorAction SilentlyContinue | Remove-Item -Force

          Write-Host "Test environment cleanup completed"
        shell: powershell

  generate-test-summary:
    name: 生成測試報告
    if: always()
    needs: test-powershell-script
    runs-on: windows-latest

    steps:
      - name: 生成測試摘要
        run: |
          echo "# PowerShell 腳本測試報告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 測試狀態概覽" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 測試項目 | 狀態 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows PowerShell 5.1 | ${{ contains(needs.test-powershell-script.result, 'success') && '[v] 通過' || '[x] 失敗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PowerShell 7.2 | ${{ contains(needs.test-powershell-script.result, 'success') && '[v] 通過' || '[x] 失敗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 測試環境" >> $GITHUB_STEP_SUMMARY
          echo "- PowerShell 版本: 5.1 (Windows PowerShell), 7.2 (PowerShell Core)" >> $GITHUB_STEP_SUMMARY
          echo "- 操作系統: Windows Server (GitHub Actions)" >> $GITHUB_STEP_SUMMARY
          echo "- Git: 系統默認版本" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 測試內容" >> $GITHUB_STEP_SUMMARY
          echo "- [v] PowerShell 腳本語法檢查" >> $GITHUB_STEP_SUMMARY
          echo "- [v] 腳本邏輯功能驗證" >> $GITHUB_STEP_SUMMARY
          echo "- [v] 多版本 PowerShell 相容性 (5.1, 7.2)" >> $GITHUB_STEP_SUMMARY
          echo "- [v] Git 環境檢測和版本驗證" >> $GITHUB_STEP_SUMMARY
          echo "- [v] 錯誤處理機制測試" >> $GITHUB_STEP_SUMMARY
          echo "- [v] Windows 環境相容性" >> $GITHUB_STEP_SUMMARY
